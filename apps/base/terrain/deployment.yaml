apiVersion: apps/v1
kind: Deployment
metadata:
  name: terrain
spec:
  # One pod: the tile cache is a ReadWriteOnce local-path volume, so the old pod must go before the new one starts.
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: terrain
  template:
    metadata:
      labels:
        app.kubernetes.io/name: terrain
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: terrain
          image: ghcr.io/hawuawu/terrain-render-service:0.1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: TERRAIN_ALLOWED_HOSTS
              value: '["terrain.localhost:*","localhost:*"]'
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: cache
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: tile-cache
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
