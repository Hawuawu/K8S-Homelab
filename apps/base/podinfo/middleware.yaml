# Security headers added by Traefik in front of podinfo. The upstream UI loads Vue/Vuetify from jsDelivr
# and uses inline scripts, so script-src allows those; everything else is locked to 'self'.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers
spec:
  headers:
    frameDeny: true
    contentTypeNosniff: true
    referrerPolicy: no-referrer
    permissionsPolicy: camera=(), microphone=(), geolocation=(), payment=(), usb=()
    contentSecurityPolicy: >-
      default-src 'self';
      script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net;
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net;
      font-src https://fonts.gstatic.com https://cdn.jsdelivr.net;
      img-src 'self' data: https://kubernetes.io https://upload.wikimedia.org https://raw.githubusercontent.com;
      connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'
    customResponseHeaders:
      Cross-Origin-Opener-Policy: same-origin
      Cross-Origin-Resource-Policy: same-origin
